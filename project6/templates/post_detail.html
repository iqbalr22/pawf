{% extends "base.html" %}

{% block content %}
<article class="detail-card">
  <p class="eyebrow">Artikel</p>
  <h2>{{ post.title }}</h2>
  <p class="post-meta">Oleh {{ post.author }}</p>
  {% if post.image %}
  <div class="post-detail-image">
    <img src="{{ post.image.url }}" alt="Foto untuk {{ post.title }}">
  </div>
  {% endif %}
  <p class="detail-body">{{ post.body }}</p>

  {% if user.is_authenticated and user == post.author %}
  <div class="post-actions">
    <a class="btn btn-secondary" href="{% url 'post_edit' post.pk %}">Edit</a>
    <a class="btn btn-danger" href="{% url 'post_delete' post.pk %}">Hapus</a>
  </div>
  {% endif %}

  <a class="btn btn-secondary" href="{% url 'home' %}">← Kembali ke beranda</a>
</article>
{% endblock content %}
